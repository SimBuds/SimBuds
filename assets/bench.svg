      <animate attributeName="width" from="0" to="273" dur="1.4s" begin="0.35s" fill="freeze"/>
    </rect>
    <text x="822" y="132" fill="#79c0ff" font-weight="700">58</text>

    <text x="28" y="179" fill="#8b949e">freedom</text>
