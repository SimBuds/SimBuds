<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Generation throughput by model: lite 140, qwen 58, freedom 57, gemma 47 tokens per second">
  <rect width="900" height="268" rx="12" fill="#0d1117"/>
